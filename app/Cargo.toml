[package]
name = "rustydxf"
description = "RustyDxf — a small, fast DXF viewer by art-tech"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rustydxf-core = { path = "../core" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "default_fonts", "clipboard", "x11", "wayland"] }
egui = "=0.37.0"
egui-wgpu = "=0.37.0"
rmcp = { version = "=3.10.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "io-std", "net", "sync", "time", "signal"] }
schemars = "=1.2.3"
rfd = "=0.18.0"
directories = "=6.0.0"
interprocess = "=2.4.8"
base64 = "=0.23.1"
winit = "=0.30.13"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSEnumerator", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Shell"] }
widestring = "=1.2.1"
