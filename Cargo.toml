[workspace]
resolver = "3"
members = ["core", "app", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["art-tech"]
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "=1.0.104"
thiserror = "=2.0.21"
log = "=0.4.35"
env_logger = "=0.11.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dxf = "=0.6.2"
lyon = "=1.0.19"
wgpu = "=30.0.2"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"
png = "=0.18.1"
ttf-parser = "=0.25.1"
epaint_default_fonts = "=0.37.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
